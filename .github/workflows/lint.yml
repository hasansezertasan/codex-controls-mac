name: lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Syntax check (bash -n)
        run: |
          for f in *.sh; do
            echo "bash -n $f"
            bash -n "$f"
          done
      - name: ShellCheck
        run: shellcheck -S warning *.sh
