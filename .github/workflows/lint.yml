name: lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Syntax check (bash -n)
        run: |
          for f in *.sh; do
            echo "bash -n $f"
            bash -n "$f"
          done
      - name: ShellCheck
        run: shellcheck -S warning *.sh
